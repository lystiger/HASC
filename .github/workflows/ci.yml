name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: "test-secret-key-for-ci-pipeline-execution"
      UPLOAD_DIR: "backend/uploads"
      TEMP_UPLOAD_DIR: "backend/temp_uploads"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Create upload directories
        run: |
          mkdir -p backend/uploads backend/temp_uploads

      - name: Run pytest
        run: |
          PYTHONPATH=backend pytest -v backend/tests

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker-verification:
    name: Docker Configuration & Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose --env-file .env.example config >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: hasc-backend:test

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: hasc-frontend:test
          build-args: |
            VITE_SITE_MODE=public
            VITE_UMAMI_ENABLED=false
            VITE_UMAMI_SCRIPT_URL=
            VITE_UMAMI_WEBSITE_ID=
            VITE_UMAMI_DASHBOARD_URL=
            VITE_API_BASE_URL=

  deploy:
    name: Continuous Deployment
    runs-on: [self-hosted, hasc-vm]
    needs: [backend-test, frontend-check, docker-verification]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Cloud Server
        run: |
          echo "=== Pulling latest changes on VM ==="
          cd /srv/hasc
          git fetch origin main
          git reset --hard origin/main

          echo "=== Building application images ==="
          docker compose build backend frontend-public frontend-admin

          echo "=== Updating containers ==="
          docker compose up -d

          echo "=== Verifying health status ==="
          sleep 10
          docker compose ps
          docker compose exec -T backend python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health/ready').read().decode())"

          echo "=== Deployment completed successfully ==="
