# Shared log-rotation policy. Docker's default json-file driver grows without
# bound; these caps keep a 24/7 VPS from filling its disk with container logs.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:13
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  umami-db:
    image: postgres:13
    restart: unless-stopped
    volumes:
      - umami_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${UMAMI_POSTGRES_USER}
      - POSTGRES_PASSWORD=${UMAMI_POSTGRES_PASSWORD}
      - POSTGRES_DB=${UMAMI_POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${UMAMI_POSTGRES_USER} -d $${UMAMI_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${UMAMI_POSTGRES_USER}:${UMAMI_POSTGRES_PASSWORD}@umami-db:5432/${UMAMI_POSTGRES_DB}
      - DATABASE_TYPE=postgresql
      - HASH_SALT=${UMAMI_HASH_SALT}
      - ALLOW_EMBEDDING=1
    depends_on:
      umami-db:
        condition: service_healthy
    logging: *default-logging

  # One-shot service that applies Alembic migrations and exits. Runs the same
  # image as the backend (no Railway-specific Dockerfile) so migrations happen
  # deterministically, exactly once, before the API or worker start. Dependents
  # gate on `service_completed_successfully`.
  migrate:
    build: ./backend
    command: alembic upgrade head
    restart: "no"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set (see .env.example)}
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  backend:
    build: ./backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - uploads_data:/app/uploads
      - temp_uploads_data:/app/temp_uploads
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set (see .env.example)}
      - UPLOAD_DIR=${UPLOAD_DIR}
      - TEMP_UPLOAD_DIR=${TEMP_UPLOAD_DIR}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-}
    healthcheck:
      # Gate dependents on readiness (DB reachable + uploads writable), not just liveness.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *default-logging

  worker:
    build: ./backend
    restart: unless-stopped
    command: python -m app.worker
    volumes:
      - uploads_data:/app/uploads
      - temp_uploads_data:/app/temp_uploads
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set (see .env.example)}
      - UPLOAD_DIR=${UPLOAD_DIR}
      - TEMP_UPLOAD_DIR=${TEMP_UPLOAD_DIR}
    # Do not start the worker until Postgres is healthy, migrations have completed,
    # and the backend reports ready.
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    logging: *default-logging

  frontend-public:
    build:
      context: ./frontend
      args:
        VITE_SITE_MODE: public
        VITE_UMAMI_ENABLED: ${VITE_UMAMI_ENABLED}
        VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID_PUBLIC}
        VITE_UMAMI_DASHBOARD_URL: ${VITE_UMAMI_DASHBOARD_URL}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL_PUBLIC}
    restart: unless-stopped
    depends_on:
      - backend
      - umami
    logging: *default-logging

  frontend-admin:
    build:
      context: ./frontend
      args:
        VITE_SITE_MODE: admin
        VITE_UMAMI_ENABLED: ${VITE_UMAMI_ENABLED}
        VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID_ADMIN}
        VITE_UMAMI_DASHBOARD_URL: ${VITE_UMAMI_DASHBOARD_URL}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL_ADMIN}
    restart: unless-stopped
    depends_on:
      - backend
      - umami
    logging: *default-logging

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS material is managed by the certbot service and shared via named volumes:
      #   certbot_conf -> /etc/letsencrypt (certs)   certbot_www -> ACME webroot
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    # Reload every 6h so renewed certificates are picked up without a restart.
    command: >-
      /bin/sh -c "while :; do sleep 21600 & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      - frontend-public
      - frontend-admin
    logging: *default-logging

  # Obtains and auto-renews Let's Encrypt certificates via the HTTP-01 (webroot)
  # challenge. Shares the cert store and ACME webroot with nginx. On first boot the
  # store is empty — run ./nginx/init-letsencrypt.sh once to bootstrap (see that
  # script). Thereafter this service renews in the background every 12h.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >-
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 43200 & wait $${!}; done"
    logging: *default-logging

volumes:
  postgres_data:
  umami_data:
  uploads_data:
  temp_uploads_data:
  certbot_conf:
  certbot_www:
