services:
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=hasc_db
    ports:
      - "5432:5432"

  umami-db:
    image: postgres:13
    volumes:
      - umami_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=umami
      - POSTGRES_DB=umami
    ports:
      - "5433:5432"

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      - DATABASE_URL=postgresql://umami:umami@umami-db:5432/umami
      - DATABASE_TYPE=postgresql
      - HASH_SALT=replace-me-with-a-long-random-string
      - ALLOW_EMBEDDING=1
    ports:
      - "3001:3000"
    depends_on:
      - umami-db

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - ./backend/temp_uploads:/app/temp_uploads
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db/hasc_db
      - UPLOAD_DIR=/app/uploads
      - TEMP_UPLOAD_DIR=/app/temp_uploads
    depends_on:
      - db

  worker:
    build: ./backend
    command: python -m app.worker
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads # Mount for processed images
      - ./backend/temp_uploads:/app/temp_uploads # Mount for temporary uploads
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db/hasc_db
      - UPLOAD_DIR=/app/uploads
      - TEMP_UPLOAD_DIR=/app/temp_uploads
    depends_on:
      - db
      - backend # Depend on backend to ensure migrations might have run if that's how it's setup

  frontend-public:
    build:
      context: ./frontend
      args:
        VITE_SITE_MODE: public
        VITE_UMAMI_ENABLED: "true"
        VITE_UMAMI_SCRIPT_URL: https://umami.hascvn.id.vn/script.js
        VITE_UMAMI_WEBSITE_ID: REPLACE_PUBLIC_WEBSITE_ID
        VITE_UMAMI_DASHBOARD_URL: https://umami.hascvn.id.vn
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
      - umami

  frontend-admin:
    build:
      context: ./frontend
      args:
        VITE_SITE_MODE: admin
        VITE_UMAMI_ENABLED: "true"
        VITE_UMAMI_SCRIPT_URL: https://umami.hascvn.id.vn/script.js
        VITE_UMAMI_WEBSITE_ID: REPLACE_ADMIN_WEBSITE_ID
        VITE_UMAMI_DASHBOARD_URL: https://umami.hascvn.id.vn
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
      - umami

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend-public
      - frontend-admin

volumes:
  postgres_data:
  umami_data:
