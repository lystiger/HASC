services:
  db:
    image: postgres:13
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

  umami-db:
    image: postgres:13
    restart: unless-stopped
    volumes:
      - umami_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${UMAMI_POSTGRES_USER}
      - POSTGRES_PASSWORD=${UMAMI_POSTGRES_PASSWORD}
      - POSTGRES_DB=${UMAMI_POSTGRES_DB}

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${UMAMI_POSTGRES_USER}:${UMAMI_POSTGRES_PASSWORD}@umami-db:5432/${UMAMI_POSTGRES_DB}
      - DATABASE_TYPE=postgresql
      - HASH_SALT=${UMAMI_HASH_SALT}
      - ALLOW_EMBEDDING=1
    depends_on:
      - umami-db

  backend:
    build: ./backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - uploads_data:/app/uploads
      - temp_uploads_data:/app/temp_uploads
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - UPLOAD_DIR=${UPLOAD_DIR}
      - TEMP_UPLOAD_DIR=${TEMP_UPLOAD_DIR}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      - db

  worker:
    build: ./backend
    restart: unless-stopped
    command: python -m app.worker
    volumes:
      - uploads_data:/app/uploads
      - temp_uploads_data:/app/temp_uploads
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - UPLOAD_DIR=${UPLOAD_DIR}
      - TEMP_UPLOAD_DIR=${TEMP_UPLOAD_DIR}
    depends_on:
      - db
      - backend # Depend on backend to ensure migrations might have run if that's how it's setup

  frontend-public:
    build:
      context: ./frontend
      args:
        VITE_SITE_MODE: public
        VITE_UMAMI_ENABLED: ${VITE_UMAMI_ENABLED}
        VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID_PUBLIC}
        VITE_UMAMI_DASHBOARD_URL: ${VITE_UMAMI_DASHBOARD_URL}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL_PUBLIC}
    restart: unless-stopped
    depends_on:
      - backend
      - umami

  frontend-admin:
    build:
      context: ./frontend
      args:
        VITE_SITE_MODE: admin
        VITE_UMAMI_ENABLED: ${VITE_UMAMI_ENABLED}
        VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID_ADMIN}
        VITE_UMAMI_DASHBOARD_URL: ${VITE_UMAMI_DASHBOARD_URL}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL_ADMIN}
    restart: unless-stopped
    depends_on:
      - backend
      - umami

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      - frontend-public
      - frontend-admin

volumes:
  postgres_data:
  umami_data:
  uploads_data:
  temp_uploads_data:
