events {}

http {
  upstream frontend_public {
    server frontend-public:80;
  }

  upstream frontend_admin {
    server frontend-admin:80;
  }

  server {
    listen 80;
    server_name hascvn.id.vn;

    location / {
      proxy_pass http://frontend_public;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 80;
    server_name admin.hascvn.id.vn;

    location / {
      proxy_pass http://frontend_admin;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 80;
    server_name umami.hascvn.id.vn;

    location / {
      proxy_pass http://umami:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
