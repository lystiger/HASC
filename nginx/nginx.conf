events {}

http {
  # Maximum accepted request body (product-image uploads). Sized for the HASC
  # catalog: MAX_IMAGES_PER_REQUEST (8) x MAX_UPLOAD_SIZE_MB (10) plus multipart
  # overhead. The backend enforces the finer-grained per-file (413) and per-image
  # (400) limits; this is the outer guard. Keep in sync with app settings if those
  # change. Intentionally bounded — never set to 0 (unlimited).
  client_max_body_size 100m;
  server_names_hash_max_size 1024;
  server_names_hash_bucket_size 128;
  upstream frontend_public {
    server frontend-public:80;
  }

  upstream frontend_admin {
    server frontend-admin:80;
  }

  # --- HTTP (port 80): ACME challenge + health, everything else -> HTTPS ---
  # Single default server handling all hostnames. Certificates are issued and
  # renewed by the certbot service over the HTTP-01 (webroot) challenge, so this
  # server must keep serving /.well-known/acme-challenge/ on plain HTTP.
  server {
    listen 80 default_server;
    server_name hascvn.id.vn admin.hascvn.id.vn umami.hascvn.id.vn;

    # Let's Encrypt HTTP-01 challenge files, written by certbot into the shared
    # webroot volume and served here without redirection.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Lightweight endpoint for the container healthcheck (no redirect, no TLS).
    location = /nginx-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    server_name hascvn.id.vn;

    # Single SAN certificate covering all three hostnames (lineage named after the
    # first -d domain passed to certbot: hascvn.id.vn).
    ssl_certificate /etc/letsencrypt/live/hascvn.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hascvn.id.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /api/ {
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /uploads/ {
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      proxy_pass http://frontend_public;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  server {
    listen 443 ssl http2;
    server_name admin.hascvn.id.vn;

    ssl_certificate /etc/letsencrypt/live/hascvn.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hascvn.id.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /api/ {
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /uploads/ {
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      proxy_pass http://frontend_admin;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  server {
    listen 443 ssl http2;
    server_name umami.hascvn.id.vn;

    ssl_certificate /etc/letsencrypt/live/hascvn.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hascvn.id.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
      proxy_pass http://umami:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
