services:
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=hasc_db
    ports:
      - "5432:5432"

  umami-db:
    image: postgres:13
    volumes:
      - umami_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=umami
      - POSTGRES_DB=umami
    ports:
      - "5433:5432"

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      - DATABASE_URL=postgresql://umami:umami@umami-db:5432/umami
      - DATABASE_TYPE=postgresql
      - HASH_SALT=replace-me-with-a-long-random-string
      - ALLOW_EMBEDDING=1
    ports:
      - "3001:3000"
    depends_on:
      - umami-db

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - ./backend/temp_uploads:/app/temp_uploads
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db/hasc_db
      - UPLOAD_DIR=/app/uploads
      - TEMP_UPLOAD_DIR=/app/temp_uploads
    depends_on:
      - db

  worker:
    build: ./backend
    command: python -m app.worker
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads # Mount for processed images
      - ./backend/temp_uploads:/app/temp_uploads # Mount for temporary uploads
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db/hasc_db
      - UPLOAD_DIR=/app/uploads
      - TEMP_UPLOAD_DIR=/app/temp_uploads
    depends_on:
      - db
      - backend # Depend on backend to ensure migrations might have run if that's how it's setup

volumes:
  postgres_data:
  umami_data:
